apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-app
  namespace: cert-management-demo
  labels:
    app: client-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-app
  template:
    metadata:
      labels:
        app: client-app
    spec:
      containers:
      - name: client-app
        image: curlimages/curl:latest
        command: ["/bin/sh"]
        args: ["-c", "sleep 3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: client-app-service
  namespace: cert-management-demo
spec:
  selector:
    app: client-app
  ports:
  - port: 80
    targetPort: 80

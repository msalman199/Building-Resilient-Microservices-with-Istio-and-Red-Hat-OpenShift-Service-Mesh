apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: circuit-breaker-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      containers:
      - name: frontend
        image: kennethreitz/httpbin
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: circuit-breaker-demo
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http

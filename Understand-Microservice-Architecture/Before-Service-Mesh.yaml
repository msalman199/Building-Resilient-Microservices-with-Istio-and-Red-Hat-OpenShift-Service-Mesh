# Manual TLS configuration per service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  template:
    spec:
      containers:
      - name: user-service
        image: user-service:v1
        env:
        - name: TLS_CERT_PATH
          value: "/etc/certs/tls.crt"
        - name: TLS_KEY_PATH
          value: "/etc/certs/tls.key"
        - name: CA_CERT_PATH
          value: "/etc/certs/ca.crt"
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/certs
      volumes:
      - name: tls-certs
        secret:
          secretName: user-service-tls

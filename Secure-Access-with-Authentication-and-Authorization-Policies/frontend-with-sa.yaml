apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: secure-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
        role: web-tier
    spec:
      serviceAccountName: frontend-sa
      containers:
      - name: frontend
        image: nginx:1.20
        ports:
        - containerPort: 80
